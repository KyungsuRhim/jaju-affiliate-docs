<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAJU 제휴 연동 문서</title>
<link rel="icon" type="image/x-icon" href="favicon-v2.ico">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --panel:#ffffff; --ink:#191f28; --ink-soft:#8b95a1;
    --line:#e5e8eb; --sidebar-bg:#ffffff;
    --blue:#3182f6; --blue-bg:#eaf2ff;
    --red:#f04452; --red-bg:#ffeef0;
    --teal:#00c2a8; --teal-bg:#e3faf6;
    --amber:#ff9f1a; --amber-bg:#fff4e2;
    --purple:#7c5cfc; --purple-bg:#f2eeff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Pretendard Variable', Pretendard, -apple-system, sans-serif; display:flex; flex-direction:column; min-height:100vh; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--blue-bg); color:var(--blue);}

  #crossbar{
    background:#ffffff; color:var(--ink-soft); display:flex; align-items:center; gap:10px;
    padding:14px 28px; font-family:'Pretendard Variable', sans-serif; font-size:13px; font-weight:600;
    flex:0 0 auto; border-bottom:1px solid var(--line);
  }
  #crossbar .lbl{color:var(--ink); font-weight:800; font-size:14px; letter-spacing:-0.01em;}
  #crossbar button{
    font-family:'Pretendard Variable', sans-serif; font-size:13px; font-weight:600;
    color:var(--ink-soft); background:#f2f4f6; cursor:pointer;
    padding:7px 16px; border-radius:99px; border:1px solid transparent; transition:all .15s ease;
  }
  #crossbar button.current{background:var(--blue); color:#fff; font-weight:700;}
  #crossbar button:hover:not(.current){background:#e8eaed; color:var(--ink);}

  #shell{display:flex; flex:1; min-height:0;}
  #sidebar{
    width:272px; flex:0 0 272px; background:var(--sidebar-bg); color:var(--ink);
    position:sticky; top:0; align-self:flex-start; padding:28px 0 40px;
    overflow-y:auto; max-height:100vh; border-right:1px solid var(--line);
  }
  #sidebar .brand{font-family:'Pretendard Variable', sans-serif; font-weight:800; font-size:19px; color:var(--ink); padding:0 24px 4px; letter-spacing:-0.02em;}
  #sidebar .brand small{display:block; font-family:'Pretendard Variable', sans-serif; font-size:11px; font-weight:600; color:var(--ink-soft); letter-spacing:0.02em; margin-top:6px;}
  .stage-track{display:flex; gap:4px; padding:18px 24px 6px;}
  .stage-track i{flex:1; height:3px; border-radius:2px; background:#f2f4f6;}
  .stage-track i.active{background:var(--dot);}
  nav.groups{margin-top:10px;}
  .group-label{display:flex; align-items:center; gap:8px; padding:16px 24px 6px; font-size:11.5px; font-weight:700; letter-spacing:0.02em; color:var(--ink-soft);}
  .group-label .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .navitem{display:block; width:100%; text-align:left; background:none; border:none; color:#4e5968; font-family:'Pretendard Variable', sans-serif; font-size:14px; font-weight:500; padding:9px 24px 9px 34px; cursor:pointer; border-left:3px solid transparent; line-height:1.4; border-radius:0 10px 10px 0; transition:all .12s ease;}
  .navitem:hover{background:#f2f4f6; color:var(--ink);}
  .navitem.active{background:var(--blue-bg); color:var(--blue); font-weight:700; border-left:3px solid var(--dot-active, var(--blue));}

  #main{flex:1; min-width:0; padding:48px 56px 100px; max-width:1040px;}
  .eyebrow{font-family:'Pretendard Variable', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.02em; color:var(--ink-soft); margin-bottom:10px;}
  h1{font-family:'Pretendard Variable', sans-serif; font-weight:800; font-size:32px; margin:0 0 6px; line-height:1.3; letter-spacing:-0.02em; color:var(--ink);}
  .sheet-sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:36px; font-weight:500;}
  .block{margin-bottom:34px;}
  .block-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .block-chip{font-family:'Pretendard Variable', sans-serif; font-size:12px; font-weight:700; letter-spacing:0; padding:4px 11px; border-radius:99px; color:#fff;}
  .block-title{font-family:'Pretendard Variable', sans-serif; font-weight:800; font-size:16.5px; color:var(--ink); letter-spacing:-0.01em;}
  .tablewrap{border:1px solid var(--line); border-radius:16px; overflow-x:auto; overflow-y:hidden; background:var(--panel); box-shadow:0 2px 8px rgba(25,31,40,0.04);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{position:sticky; top:0; background:#f8f9fa; text-align:left; padding:11px 14px; font-weight:700; font-size:12.5px; color:var(--ink); border-bottom:1px solid var(--line); white-space:nowrap;}
  thead th.mall-EC{border-bottom:2px solid var(--teal);}
  thead th.mall-SSGV{border-bottom:2px solid var(--blue);}
  thead th.mall-S{border-bottom:2px solid var(--red);}
  tbody td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; color:#333d4b; word-break:keep-all; overflow-wrap:break-word; font-weight:500;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even){background:#fbfbfc;}
  tbody tr:hover{background:var(--blue-bg);}
  td:first-child, th:first-child{font-family:'JetBrains Mono', monospace; font-size:12.8px; color:var(--blue); font-weight:600;}
  td.empty{color:#c0c4cc;}
  td.na-text{color:#b0b8c1; font-style:normal; font-weight:500;}
  td.status-ok{color:var(--teal); font-weight:700;}
  td.status-pending{color:var(--amber); font-weight:700;}
  .mall-tabs{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .mall-tab{font-family:'Pretendard Variable', sans-serif; font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:99px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer; transition:all .12s ease;}
  .mall-tab:hover{background:#f8f9fa;}
  .mall-tab.active{color:#fff; border-color:transparent;}
  .hint-scroll{font-size:11.5px; color:var(--ink-soft); margin:-4px 0 10px; font-family:'Pretendard Variable', sans-serif; font-weight:500;}
  footer.note{margin-top:60px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft); font-weight:500;}

  @media (max-width: 860px){
    #shell{flex-direction:column;}
    #sidebar{position:relative; width:100%; flex:none; max-height:none;}
    #main{padding:32px 20px 80px;}
    #crossbar{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div id="crossbar">
  <span class="lbl">JAJU 문서</span>
  <button id="btn-api" onclick="switchDoc('api')">API 명세 (3개몰 비교)</button>
  <button id="btn-map" onclick="switchDoc('map')">자사 매핑 정의서</button>
</div>

<div id="shell">
  <div id="sidebar">
    <div class="brand" id="brandTitle"><small id="brandSub"></small></div>
    <div class="stage-track" id="stageTrack"></div>
    <nav class="groups" id="navGroups"></nav>
  </div>
  <div id="main">
    <div class="eyebrow" id="crumbEyebrow"></div>
    <h1 id="sheetTitle"></h1>
    <div class="sheet-sub" id="sheetSub"></div>
    <div id="blocks"></div>
    <footer class="note" id="footerNote"></footer>
  </div>
</div>

function mallClass(h){
  if(/EC-MONITOR/i.test(h)) return 'mall-EC';
  if(/신세계/.test(h)) return 'mall-SSGV';
  if(/S몰/.test(h)) return 'mall-S';
  return '';
}
function isNegativeValue(v){
  if(!v) return false;
  // strip leading symbols/emoji (❌, ⚠, bullets, etc.) before matching
  const stripped = v.replace(/^[^가-힣a-zA-Z0-9]+/, '').trim();
  return /^(없음|미사용|해당\s*없음|해당사항\s*없음|안\s*함|사용\s*안\s*함|취급\s*안\s*함|불필요|필요\s*없음|제외)/.test(stripped);
}
function cellClass(v){
  if(v === '' || v === '-') return 'empty';
  if(v === '확정') return 'status-ok';
  if(/보류|확인필요/.test(v || '')) return 'status-pending';
  if(isNegativeValue(v)) return 'na-text';
  return '';
}
const blockColors = {
  '실행 방식 요약 (오케스트레이션)': {bg:'#ffb800', label:'실행 방식'},
  'API 개요': {bg:'#1b64da', label:'API 개요'},

function chipFor(title){

  if(/공통 원칙|자사.*매핑/.test(title)) return {bg:'#7c5cfc', label:'매핑 정의'};
  return {bg:'#00a693', label:'필드 상세'};
}
function detectMallGroups(headers){
  const mallDefs = [
    {key:'EC', test:/EC-MONITOR/i, color:'#00c2a8', label:'EC-MONITOR'},
    {key:'SSGV', test:/신세계/, color:'#3182f6', label:'신세계V'},
    {key:'S', test:/S몰/, color:'#f04452', label:'S몰'},
  ];
  const groups = {};
  let firstMallIdx = headers.length;
  let lastMallIdx = -1;
  headers.forEach((h, idx) => {
    for(const m of mallDefs){
      if(m.test.test(h)){
        if(headers[idx+1] === '설명'){
          groups[m.key] = {label:m.label, color:m.color, cols:[idx, idx+1]};
          if(idx < firstMallIdx) firstMallIdx = idx;
          if(idx+1 > lastMallIdx) lastMallIdx = idx+1;
        }
        return;
      }
    }
  });
  const leading = [];
  for(let i=0;i<firstMallIdx;i++) leading.push(i);
  const trailing = [];
  if(lastMallIdx >= 0){
    for(let i=lastMallIdx+1;i<headers.length;i++) trailing.push(i);
  }
  return {leading, trailing, groups, hasMalls: Object.keys(groups).length >= 2};
}
function widthFor(headerText){
  if(/필수/.test(headerText)) return 78;
  if(headerText === '구분') return 110;
  if(/필드명/.test(headerText)) return 200;
  if(headerText === '설명') return 300;
  if(headerText === '상태') return 130;
  return 170;
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function stripBold(v){
  if(typeof v !== 'string') return {text: v, bold: false};
  const m = v.match(/^\*\*([\s\S]*)\*\*$/);
  if(m) return {text: m[1], bold: true};
  return {text: v, bold: false};
}
function buildTableDom(headers, rows, colIdxs){
  const table = document.createElement('table');
  table.style.tableLayout = 'fixed';
  const colgroup = document.createElement('colgroup');
  colIdxs.forEach(idx => {
    const col = document.createElement('col');
    col.style.width = widthFor(headers[idx]) + 'px';
    colgroup.appendChild(col);
  });
  table.appendChild(colgroup);
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  colIdxs.forEach(idx => {
    const th = document.createElement('th');
    th.textContent = headers[idx];
    const mc = mallClass(headers[idx]);
    if(mc) th.className = mc;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    colIdxs.forEach(idx => {
      const raw = row[idx];
      const {text, bold} = stripBold(raw);
      const td = document.createElement('td');
      const display = (text === '' || text === undefined ? '–' : text);
      if(bold){
        td.innerHTML = '<strong>' + escapeHtml(String(display)) + '</strong>';
      } else {
        td.textContent = display;
      }
      td.className = cellClass(text);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

  const tw = document.createElement('div');
  tw.className = 'tablewrap';
  function currentColIdxs(){
    if(!hasMalls || activeMall === 'ALL') return block.headers.map((_,i)=>i);
    return [...leading, ...groups[activeMall].cols, ...trailing];
  }
  function redraw(){
    tw.innerHTML = '';
    tw.appendChild(buildTableDom(block.headers, block.rows, currentColIdxs()));
  }
  if(hasMalls){
    const tabs = document.createElement('div');
    tabs.className = 'mall-tabs';
    function makeTab(key, label, color){
      const b = document.createElement('button');
      b.className = 'mall-tab' + (key===activeMall ? ' active' : '');
      b.textContent = label;
      if(key===activeMall) b.style.background = color;
      b.onclick = () => {
        activeMall = key;
        [...tabs.children].forEach(btn => { btn.classList.remove('active'); btn.style.background=''; });
        b.classList.add('active');
        b.style.background = color;
        redraw();
      };
      return b;
    }
    tabs.appendChild(makeTab('ALL','전체','#242320'));
    Object.entries(groups).forEach(([key,g]) => tabs.appendChild(makeTab(key, g.label, g.color)));
    wrap.appendChild(tabs);
  }
  const hint = document.createElement('div');
  hint.className = 'hint-scroll';
  hint.textContent = hasMalls ? '← 좌우 스크롤 가능 · 탭으로 특정 몰만 보기 →' : '← 좌우 스크롤 가능 →';
  wrap.appendChild(hint);
  wrap.appendChild(tw);
  redraw();
  return wrap;
}

function renderSidebar(docKey, activeName){
  const doc = DOCS[docKey];
  const nav = document.getElementById('navGroups');
  nav.innerHTML = '';
  doc.groups.forEach(([label, color, names]) => {
    const gl = document.createElement('div');
    gl.className = 'group-label';
    gl.innerHTML = `<span class="dot" style="background:${color}"></span>${label}`;
    nav.appendChild(gl);
    names.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'navitem' + (name === activeName ? ' active' : '');
      btn.textContent = name;
      btn.style.setProperty('--dot-active', color);
      btn.onclick = () => { location.hash = docKey + '/' + encodeURIComponent(name); };
      nav.appendChild(btn);
    });
  });
  const track = document.getElementById('stageTrack');
  track.innerHTML = '';
  doc.groups.forEach(([label, color, names]) => {
    const isActive = names.includes(activeName);
    const seg = document.createElement('i');
    if(isActive){ seg.classList.add('active'); seg.style.setProperty('--dot', color); seg.style.background = color; }
    track.appendChild(seg);
  });
}

function renderSheet(docKey, name){
  const doc = DOCS[docKey];
  const sheet = doc.sheets.find(s => s.name === name) || doc.sheets[0];

  document.getElementById('brandTitle').innerHTML = doc.brandTitle + '<small id="brandSub"></small>';
  document.getElementById('brandSub').textContent = doc.brandSub;
  document.getElementById('footerNote').textContent = doc.footer;

  let groupLabel = '';
  doc.groups.forEach(([label,,names]) => { if(names.includes(sheet.name)) groupLabel = label; });

  document.getElementById('crumbEyebrow').textContent = `${groupLabel} / ${sheet.name}`;
  document.getElementById('sheetTitle').textContent = sheet.name;
  document.getElementById('sheetSub').textContent = `${sheet.blocks.length}개 섹션`;

  const container = document.getElementById('blocks');
  container.innerHTML = '';
  sheet.blocks.forEach(block => {
    const chip = chipFor(block.title);
    const wrap = document.createElement('div');
    wrap.className = 'block';
    const head = document.createElement('div');
    head.className = 'block-head';
    head.innerHTML = `<span class="block-chip" style="background:${chip.bg}">${chip.label}</span><span class="block-title">${block.title}</span>`;
    wrap.appendChild(head);
    wrap.appendChild(renderTable(block));
    container.appendChild(wrap);
  });

  renderSidebar(docKey, sheet.name);

  document.getElementById('btn-api').classList.toggle('current', docKey==='api');
  document.getElementById('btn-map').classList.toggle('current', docKey==='map');

  window.scrollTo(0,0);
}

function switchDoc(docKey){
  const doc = DOCS[docKey];
  location.hash = docKey + '/' + encodeURIComponent(doc.sheets[0].name);
}

function parseHash(){
  const raw = decodeURIComponent(location.hash.replace('#',''));
  const slash = raw.indexOf('/');
  if(slash === -1) return {docKey:'api', name: DOCS['api'].sheets[0].name};
  const docKey = raw.slice(0, slash);
  const name = raw.slice(slash+1);
  if(!DOCS[docKey]) return {docKey:'api', name: DOCS['api'].sheets[0].name};
  const valid = DOCS[docKey].sheets.some(s => s.name === name);
  return {docKey, name: valid ? name : DOCS[docKey].sheets[0].name};
}

window.addEventListener('hashchange', () => {
  const {docKey, name} = parseHash();
  currentDoc = docKey;
  renderSheet(docKey, name);
});

(function init(){
  const {docKey, name} = parseHash();
  currentDoc = docKey;
  renderSheet(docKey, name);
})();
</script>
</body>
