<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAJU 제휴 연동 문서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f5f0; --panel:#ffffff; --ink:#242320; --ink-soft:#5a5850;
    --line:#e4e0d6; --sidebar-bg:#1c1b19;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif; display:flex; flex-direction:column; min-height:100vh;}
  ::selection{background:#d9cdb8;}

  #crossbar{
    background:#100f0d; color:#cfccc0; display:flex; align-items:center; gap:10px;
    padding:10px 24px; font-family:'JetBrains Mono', monospace; font-size:12.5px;
    flex:0 0 auto; border-bottom:1px solid #333228;
  }
  #crossbar .lbl{color:#7d7a6c; letter-spacing:0.06em; text-transform:uppercase; font-size:11px;}
  #crossbar button{
    font-family:'JetBrains Mono', monospace; font-size:12.5px;
    color:#e9e6da; background:none; cursor:pointer;
    padding:5px 12px; border-radius:99px; border:1px solid #3a3930;
  }
  #crossbar button.current{background:#e9e6da; color:#100f0d; border-color:#e9e6da; font-weight:600;}
  #crossbar button:hover:not(.current){border-color:#8a8778;}

  #shell{display:flex; flex:1; min-height:0;}
  #sidebar{
    width:272px; flex:0 0 272px; background:var(--sidebar-bg); color:#d8d5cc;
    position:sticky; top:0; align-self:flex-start; padding:28px 0 40px;
    overflow-y:auto; max-height:100vh;
  }
  #sidebar .brand{font-family:'Noto Serif KR', serif; font-weight:700; font-size:19px; color:#f4f1ea; padding:0 24px 4px;}
  #sidebar .brand small{display:block; font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:400; color:#8a8778; letter-spacing:0.08em; margin-top:6px; text-transform:uppercase;}
  .stage-track{display:flex; gap:4px; padding:18px 24px 6px;}
  .stage-track i{flex:1; height:3px; border-radius:2px; background:#3a3934;}
  .stage-track i.active{background:var(--dot);}
  nav.groups{margin-top:10px;}
  .group-label{display:flex; align-items:center; gap:8px; padding:16px 24px 6px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#96937f;}
  .group-label .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .navitem{display:block; width:100%; text-align:left; background:none; border:none; color:#c7c4b8; font-family:'Noto Sans KR', sans-serif; font-size:14px; padding:8px 24px 8px 34px; cursor:pointer; border-left:2px solid transparent; line-height:1.4;}
  .navitem:hover{background:#26251f; color:#f4f1ea;}
  .navitem.active{background:#26251f; color:#f4f1ea; font-weight:500; border-left:2px solid var(--dot-active, #b0463f);}

  #main{flex:1; min-width:0; padding:48px 56px 100px; max-width:1040px;}
  .eyebrow{font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px;}
  h1{font-family:'Noto Serif KR', serif; font-weight:700; font-size:34px; margin:0 0 6px; line-height:1.25;}
  .sheet-sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:36px;}
  .block{margin-bottom:34px;}
  .block-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .block-chip{font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:600; letter-spacing:0.04em; padding:3px 9px; border-radius:99px; color:#fff;}
  .block-title{font-family:'Noto Serif KR', serif; font-weight:700; font-size:16.5px;}
  .tablewrap{border:1px solid var(--line); border-radius:10px; overflow-x:auto; overflow-y:hidden; background:var(--panel); box-shadow:0 1px 2px rgba(30,28,20,0.04);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{position:sticky; top:0; background:#efece3; text-align:left; padding:10px 14px; font-weight:700; font-size:12.5px; color:var(--ink); border-bottom:1px solid var(--line); white-space:nowrap;}
  thead th.mall-EC{border-bottom:2px solid #5c7a80;}
  thead th.mall-SSGV{border-bottom:2px solid #3d4a7a;}
  thead th.mall-S{border-bottom:2px solid #b0463f;}
  tbody td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:top; color:#3a3830; word-break:keep-all; overflow-wrap:break-word;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even){background:#fbfaf7;}
  tbody tr:hover{background:#f3efe4;}
  td:first-child, th:first-child{font-family:'JetBrains Mono', monospace; font-size:12.8px; color:#1f4f42;}
  td.empty{color:#c4c0b3;}
  td.status-ok{color:#2f6b4f; font-weight:600;}
  td.status-pending{color:#a3690f; font-weight:600;}
  .mall-tabs{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .mall-tab{font-family:'JetBrains Mono', monospace; font-size:12px; padding:5px 12px; border-radius:99px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;}
  .mall-tab.active{color:#fff; border-color:transparent;}
  .hint-scroll{font-size:11.5px; color:#a49f8e; margin:-4px 0 10px; font-family:'JetBrains Mono', monospace;}
  footer.note{margin-top:60px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:#8f8b7c;}

  @media (max-width: 860px){
    #shell{flex-direction:column;}
    #sidebar{position:relative; width:100%; flex:none; max-height:none;}
    #main{padding:32px 20px 80px;}
    #crossbar{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div id="crossbar">
  <span class="lbl">JAJU 문서</span>
  <button id="btn-api" onclick="switchDoc('api')">API 명세 (3개몰 비교)</button>
  <button id="btn-map" onclick="switchDoc('map')">자사 매핑 정의서</button>
</div>

<div id="shell">
  <div id="sidebar">
    <div class="brand" id="brandTitle"><small id="brandSub"></small></div>
    <div class="stage-track" id="stageTrack"></div>
    <nav class="groups" id="navGroups"></nav>
  </div>
  <div id="main">
    <div class="eyebrow" id="crumbEyebrow"></div>
    <h1 id="sheetTitle"></h1>
    <div class="sheet-sub" id="sheetSub"></div>
    <div id="blocks"></div>
    <footer class="note" id="footerNote"></footer>
  </div>
</div>

let currentDoc = 'api';

function mallClass(h){
  if(/EC-MONITOR/i.test(h)) return 'mall-EC';
  if(/신세계/.test(h)) return 'mall-SSGV';
  if(/S몰/.test(h)) return 'mall-S';
  return '';
}
function cellClass(v){
  if(v === '' || v === '-') return 'empty';
  if(v === '확정') return 'status-ok';
  if(/보류|확인필요/.test(v || '')) return 'status-pending';
  return '';
}
const blockColors = {
  '실행 방식 요약 (오케스트레이션)': {bg:'#b8860b', label:'실행 방식'},
  'API 개요': {bg:'#3b6ea5', label:'API 개요'},
};
function chipFor(title){
  if(blockColors[title]) return blockColors[title];
  if(/공통 원칙|자사.*매핑/.test(title)) return {bg:'#6a4fa0', label:'매핑 정의'};
  return {bg:'#3f7a5c', label:'필드 상세'};
}
function detectMallGroups(headers){
  const mallDefs = [
    {key:'EC', test:/EC-MONITOR/i, color:'#5c7a80', label:'EC-MONITOR'},
    {key:'SSGV', test:/신세계/, color:'#3d4a7a', label:'신세계V'},
    {key:'S', test:/S몰/, color:'#b0463f', label:'S몰'},
  ];
  const groups = {};
  let firstMallIdx = headers.length;
  headers.forEach((h, idx) => {
    for(const m of mallDefs){
      if(m.test.test(h)){
        if(headers[idx+1] === '설명'){
          groups[m.key] = {label:m.label, color:m.color, cols:[idx, idx+1]};
          if(idx < firstMallIdx) firstMallIdx = idx;
        }
        return;
      }
    }
  });
  const leading = [];
  for(let i=0;i<firstMallIdx;i++) leading.push(i);
  return {leading, groups, hasMalls: Object.keys(groups).length >= 2};
}
function widthFor(headerText){
  if(/필수/.test(headerText)) return 78;
  if(headerText === '구분') return 110;
  if(/필드명/.test(headerText)) return 200;
  if(headerText === '설명') return 300;
  if(headerText === '상태') return 130;
  return 170;
}
function buildTableDom(headers, rows, colIdxs){
  const table = document.createElement('table');
  table.style.tableLayout = 'fixed';
  const colgroup = document.createElement('colgroup');
  colIdxs.forEach(idx => {
    const col = document.createElement('col');
    col.style.width = widthFor(headers[idx]) + 'px';
    colgroup.appendChild(col);
  });
  table.appendChild(colgroup);
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  colIdxs.forEach(idx => {
    const th = document.createElement('th');
    th.textContent = headers[idx];
    const mc = mallClass(headers[idx]);
    if(mc) th.className = mc;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    colIdxs.forEach(idx => {
      const v = row[idx];
      const td = document.createElement('td');
      td.textContent = (v === '' || v === undefined ? '–' : v);
      td.className = cellClass(v);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

  function currentColIdxs(){
    if(!hasMalls || activeMall === 'ALL') return block.headers.map((_,i)=>i);
    return [...leading, ...groups[activeMall].cols];
  }
  function redraw(){
    tw.innerHTML = '';
    tw.appendChild(buildTableDom(block.headers, block.rows, currentColIdxs()));
  }
  if(hasMalls){
    const tabs = document.createElement('div');
    tabs.className = 'mall-tabs';
    function makeTab(key, label, color){
      const b = document.createElement('button');
      b.className = 'mall-tab' + (key===activeMall ? ' active' : '');
      b.textContent = label;
      if(key===activeMall) b.style.background = color;
      b.onclick = () => {
        activeMall = key;
        [...tabs.children].forEach(btn => { btn.classList.remove('active'); btn.style.background=''; });
        b.classList.add('active');
        b.style.background = color;
        redraw();
      };
      return b;
    }
    tabs.appendChild(makeTab('ALL','전체','#242320'));
    Object.entries(groups).forEach(([key,g]) => tabs.appendChild(makeTab(key, g.label, g.color)));
    wrap.appendChild(tabs);
  }
  const hint = document.createElement('div');
  hint.className = 'hint-scroll';
  hint.textContent = hasMalls ? '← 좌우 스크롤 가능 · 탭으로 특정 몰만 보기 →' : '← 좌우 스크롤 가능 →';
  wrap.appendChild(hint);
  wrap.appendChild(tw);
  redraw();
  return wrap;
}

function renderSidebar(docKey, activeName){
  const doc = DOCS[docKey];
  const nav = document.getElementById('navGroups');
  nav.innerHTML = '';
  doc.groups.forEach(([label, color, names]) => {
    const gl = document.createElement('div');
    gl.className = 'group-label';
    gl.innerHTML = `<span class="dot" style="background:${color}"></span>${label}`;
    nav.appendChild(gl);
    names.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'navitem' + (name === activeName ? ' active' : '');
      btn.textContent = name;
      btn.style.setProperty('--dot-active', color);
      btn.onclick = () => { location.hash = docKey + '/' + encodeURIComponent(name); };
      nav.appendChild(btn);
    });
  });
  const track = document.getElementById('stageTrack');
  track.innerHTML = '';
  doc.groups.forEach(([label, color, names]) => {
    const isActive = names.includes(activeName);
    const seg = document.createElement('i');
    if(isActive){ seg.classList.add('active'); seg.style.setProperty('--dot', color); seg.style.background = color; }
    track.appendChild(seg);
  });
}

function renderSheet(docKey, name){
  const doc = DOCS[docKey];
  const sheet = doc.sheets.find(s => s.name === name) || doc.sheets[0];

  document.getElementById('brandTitle').innerHTML = doc.brandTitle + '<small id="brandSub"></small>';
  document.getElementById('brandSub').textContent = doc.brandSub;
  document.getElementById('footerNote').textContent = doc.footer;

  let groupLabel = '';
  doc.groups.forEach(([label,,names]) => { if(names.includes(sheet.name)) groupLabel = label; });

  document.getElementById('crumbEyebrow').textContent = `${groupLabel} / ${sheet.name}`;
  document.getElementById('sheetTitle').textContent = sheet.name;
  document.getElementById('sheetSub').textContent = `${sheet.blocks.length}개 섹션`;

  const container = document.getElementById('blocks');
  container.innerHTML = '';
  sheet.blocks.forEach(block => {
    const chip = chipFor(block.title);
    const wrap = document.createElement('div');
    wrap.className = 'block';
    const head = document.createElement('div');
    head.className = 'block-head';
    head.innerHTML = `<span class="block-chip" style="background:${chip.bg}">${chip.label}</span><span class="block-title">${block.title}</span>`;
    wrap.appendChild(head);
    wrap.appendChild(renderTable(block));
    container.appendChild(wrap);
  });

  renderSidebar(docKey, sheet.name);

  document.getElementById('btn-api').classList.toggle('current', docKey==='api');
  document.getElementById('btn-map').classList.toggle('current', docKey==='map');

  window.scrollTo(0,0);
}

function switchDoc(docKey){
  const doc = DOCS[docKey];
  location.hash = docKey + '/' + encodeURIComponent(doc.sheets[0].name);
}

function parseHash(){
  const raw = decodeURIComponent(location.hash.replace('#',''));
  const slash = raw.indexOf('/');
  if(slash === -1) return {docKey:'api', name: DOCS['api'].sheets[0].name};
  const docKey = raw.slice(0, slash);
  const name = raw.slice(slash+1);
  if(!DOCS[docKey]) return {docKey:'api', name: DOCS['api'].sheets[0].name};
  const valid = DOCS[docKey].sheets.some(s => s.name === name);
  return {docKey, name: valid ? name : DOCS[docKey].sheets[0].name};
}

window.addEventListener('hashchange', () => {
  const {docKey, name} = parseHash();
  currentDoc = docKey;
  renderSheet(docKey, name);
});

(function init(){
  const {docKey, name} = parseHash();
  currentDoc = docKey;
  renderSheet(docKey, name);
})();
</script>
</body>
